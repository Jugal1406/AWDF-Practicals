
name: CI Pipeline

# ITUE301: Advanced Web Development Frameworks
# Practical 12: CI/CD Pipeline with GitHub Actions
# Student: Jugal Kshatriya (24CS042)

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint:
    name: Code Quality & Lint Audit
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js Runtime
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: ITUE301-AWDF_Practical12-main/backend/package-lock.json

      - name: Install Backend Dependencies
        working-directory: ./ITUE301-AWDF_Practical12-main/backend
        run: npm ci

      - name: Run Linter & Static Analysis
        working-directory: ./ITUE301-AWDF_Practical12-main/backend
        run: npm run lint

  build-and-test:
    name: Build & Automated Tests
    runs-on: ubuntu-latest
    needs: lint

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js Runtime
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: ITUE301-AWDF_Practical12-main/backend/package-lock.json

      - name: Install Backend Dependencies
        working-directory: ./ITUE301-AWDF_Practical12-main/backend
        run: npm ci

      - name: Execute Automated Test Suite
        working-directory: ./ITUE301-AWDF_Practical12-main/backend
        run: npm test
        env:
          NODE_ENV: test
          JWT_SECRET: supersecret_ci_test_key_24cs042
          PORT: 5000

      - name: Pipeline Status Summary
        if: always()
        run: |
          echo "=========================================="
          echo "Practical 12 CI Pipeline Completed"
          echo "Student: Jugal Kshatriya (24CS042)"
          echo "Test Job Status: ${{ job.status }}"
          echo "=========================================="
